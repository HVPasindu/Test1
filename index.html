<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body{
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f2f3f5;
      padding: 20px;
    }

    .card{
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    h2{
      text-align: center;
      margin-bottom: 8px;
    }

    .sub{
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label{
      display: block;
      margin: 12px 0 6px;
      font-size: 14px;
      color: #333;
    }

    input{
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
    }

    input:focus{
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
    }

    .row{
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 10px;
      font-size: 14px;
    }

    .row a{
      text-decoration: none;
      color: #0d6efd;
    }

    .btn{
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 10px;
      margin-top: 18px;
      background: #0d6efd;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover{
      opacity: 0.95;
    }

    .or{
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: #666;
      font-size: 13px;
    }
    .or span{
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .google{
      width: 100%;
      height: 46px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      font-size: 15px;
    }

    .footer{
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #555;
    }
    .footer a{ color: #0d6efd; text-decoration: none; }

    /* small screens */
    @media (max-width: 480px){
      .card{ padding: 22px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Welcome Back</h2>
    <p class="sub">Please login to continue</p>

    <form>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="Enter your email" required />

      <label for="pass">Password</label>
      <input id="pass" type="password" placeholder="Enter your password" required />

      <div class="row">
        <label style="margin:0; display:flex; align-items:center; gap:8px;">
          <input type="checkbox" style="width:auto; height:auto;" />
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="btn" type="submit">Login</button>

      <div class="or">
        <span></span> OR <span></span>
      </div>

      <button class="google" type="button">Sign in with Google</button>

      <div class="footer">
        Don’t have an account? <a href="#">Sign up</a>
      </div>
    </form>
  </div>

</body>
</html>
